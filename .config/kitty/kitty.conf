# vim:fileencoding=utf-8:foldmethod=marker

initial_window_width  1850
initial_window_height 1000
remember_window_size  no

font_family      JetBrainsMono Nerd Font Mono
bold_font        auto
italic_font      auto
bold_italic_font auto
font_size 9.0
adjust_line_height 100%
font_features none
dynamic_title yes

# vim:fileencoding=utf-8:foldmethod=marker

# Font settings
bold_font        auto
italic_font      auto
bold_italic_font auto
font_size 9.0
adjust_line_height 100%
font_features none

# Font size: half-point (0.5) stepping — overrides Kitty's default 1.0 step.
map ctrl+shift+equal       change_font_size all +0.5
map ctrl+shift+plus        change_font_size all +0.5
map ctrl+shift+kp_add      change_font_size all +0.5
map ctrl+shift+minus       change_font_size all -0.5
map ctrl+shift+kp_subtract change_font_size all -0.5

# Bell
window_alert_on_bell yes
enable_audio_bell yes

# Cursor
cursor_blink_interval 0

# Window
hide_window_decorations titlebar-only

# Theme
include current-theme.conf

# Written by toggle-app-transparency.sh; must follow the theme to override it.
include opacity.conf

map ctrl+/ send_text all \x1f
