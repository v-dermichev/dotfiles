env = LIBVA_DRIVER_NAME,nvidia
env = GBM_BACKEND,nvidia-drm
env = __GLX_VENDOR_LIBRARY_NAME,nvidia
env = NVD_BACKEND,direct
env = QT_QPA_PLATFORMTHEME,qt6ct
env = XDG_CURRENT_DESKTOP,Hyprland
env = TERMINAL, kitty
env = _JAVA_AWT_WM_NONREPARENTING, 1

$internal = eDP-1
$external = HDMI-A-1
$internalMode = 1920x1080@144
$externalMode = 1920x1080@120
$activeOpacity = 0.95
$inactiveOpacity = 0.90
$btDevices = XX:XX:XX:XX:XX:XX YY:YY:YY:YY:YY:YY
$screenshotDir = ~/Screenshots

env = HYPR_ACTIVE_OPACITY, $activeOpacity
env = HYPR_INACTIVE_OPACITY, $inactiveOpacity
env = HYPR_INTERNAL, $internal
env = HYPR_EXTERNAL, $external
env = HYPR_INTERNAL_MODE, $internalMode

monitor = $internal, $internalMode, 0x0, 1
monitor = $external, $externalMode, 1920x0, 1

# Auto-disable internal monitor when external is connected
# Uses a lid switch handler to persist across DPMS/suspend/hotplug
bindl = , switch:on:Lid Switch, exec, hyprctl monitors | grep -q "$external" && hyprctl keyword monitor "$internal, disable"
bindl = , switch:off:Lid Switch, exec, hyprctl monitors | grep -q "$external" && hyprctl keyword monitor "$internal, disable" || hyprctl keyword monitor "$internal, $internalMode, 0x0, 1"

input {
    kb_layout = us,ru
    kb_options = grp:alt_shift_toggle
    follow_mouse = 2
}

cursor {
    no_hardware_cursors = false
    default_monitor = $external
}

misc {
    disable_hyprland_logo = true
    force_default_wallpaper = 0
}

animations {
    enabled = true
}

decoration {
    rounding = 8
    active_opacity = $activeOpacity
    inactive_opacity = $inactiveOpacity
}

general {
    layout = dwindle
    resize_on_border = true
    extend_border_grab_area = 14
    hover_icon_on_border = true
    border_size = 2
    col.active_border = rgba(8899aacc)
    col.inactive_border = rgba(2b303b88)
}

dwindle {
    pseudotile = true
    preserve_split = true
}

master {
    new_status = master
}

workspace = 1, monitor:$external, default:true
workspace = 2, monitor:$external
workspace = 3, monitor:$external #, layout:master
workspace = 4, monitor:$external #, layout:master
workspace = 5, monitor:$external
workspace = 6, monitor:$external
workspace = 7, monitor:$external
workspace = 8, monitor:$external
workspace = 9, monitor:$internal, default:true

# Named workspaces
workspace = name:IDE, monitor:$external
workspace = name:Steam, monitor:$external
workspace = name:Windows, monitor:$external

# Scratchpads
workspace = special:music, on-created-empty:chromium --app=https://music.yandex.ru --profile-directory=Music
workspace = special:messenger, on-created-empty:chromium --app=https://messenger.360.yandex.com/ --profile-directory=Messenger
workspace = special:telegram, on-created-empty:telegram-desktop
workspace = special:obsidian, on-created-empty:obsidian

# Autostart
exec-once = dbus-update-activation-environment --systemd WAYLAND_DISPLAY XDG_CURRENT_DESKTOP
exec-once = gsettings set org.gnome.desktop.interface color-scheme prefer-dark
exec-once = swww-daemon
exec-once = swaync
exec-once = waybar
exec-once = nm-applet --indicator
exec-once = blueman-applet
exec-once = gnome-keyring-daemon --start --components=secrets --control-directory=/run/user/1000/keyring
exec-once = /usr/lib/polkit-gnome/polkit-gnome-authentication-agent-1
exec-once = [workspace 1] brave
exec-once = wl-paste --watch cliphist store
exec-once = wayscriber --daemon
exec-once = hyprctl monitors | grep -q "$external" && hyprctl keyword monitor "$internal, disable"
exec-once = ~/.config/hypr/scripts/monitor-watcher.sh
exec-once = ~/.config/hypr/scripts/bt-autoconnect.sh $btDevices
exec-once = [workspace 2] kitty yazi ~


# Keybinds
$mod = SUPER

bind = $mod, P, exec, ~/.config/hypr/scripts/toggle-internal-monitor.sh

# bind = $mod, C, exec, ~/.config/hypr/scripts/wofi-wrapper.sh cliphist

bind = $mod, Return, exec, kitty
bind = $mod, D, exec, ~/.config/hypr/scripts/wofi-wrapper.sh drun
bind = $mod, Q, killactive
bind = $mod, M, exit
bind = $mod SHIFT, Q, exec, pkill waybar; waybar &

# Scratchpads
bind = $mod, Z, togglespecialworkspace, messenger
bind = $mod, X, togglespecialworkspace, music
bind = $mod, C, togglespecialworkspace, obsidian
bind = $mod, V, togglespecialworkspace, telegram

# Named workspaces
bind = $mod, A, exec, ~/.config/hypr/scripts/workspace-launch.sh IDE pycharm
bind = $mod, S, exec, ~/.config/hypr/scripts/workspace-launch.sh Steam steam
bind = $mod, W, exec, ~/.config/hypr/scripts/workspace-launch.sh Windows virt-manager

# Focus
bind = $mod, left, movefocus, l
bind = $mod, right, movefocus, r
bind = $mod, up, movefocus, u
bind = $mod, down, movefocus, d
bind = $mod, H, movefocus, l
bind = $mod, L, movefocus, r
bind = $mod, K, movefocus, u
bind = $mod, J, movefocus, d

# Move windows
bind = $mod SHIFT, left, movewindow, l
bind = $mod SHIFT, right, movewindow, r
bind = $mod SHIFT, up, movewindow, u
bind = $mod SHIFT, down, movewindow, d

# Floating & layout
bind = $mod SHIFT, Z, togglefloating
bind = $mod, F, fullscreen

# Mouse
bindm = $mod, mouse:272, movewindow
bindm = $mod, mouse:273, resizewindow

# Workspace scroll
bind = $mod, mouse_up, workspace, e+1
bind = $mod, mouse_down, workspace, e-1

# Switch workspace
bind = $mod, 1, workspace, 1
bind = $mod, 2, workspace, 2
bind = $mod, 3, workspace, 3
bind = $mod, 4, workspace, 4
bind = $mod, 5, workspace, 5
bind = $mod, 6, workspace, 6
bind = $mod, 7, workspace, 7
bind = $mod, 8, workspace, 8
bind = $mod, 9, workspace, 9

# Move window to workspace
bind = $mod SHIFT, 1, movetoworkspace, 1
bind = $mod SHIFT, 2, movetoworkspace, 2
bind = $mod SHIFT, 3, movetoworkspace, 3
bind = $mod SHIFT, 4, movetoworkspace, 4
bind = $mod SHIFT, 5, movetoworkspace, 5
bind = $mod SHIFT, 6, movetoworkspace, 6
bind = $mod SHIFT, 7, movetoworkspace, 7
bind = $mod SHIFT, 8, movetoworkspace, 8
bind = $mod SHIFT, 9, movetoworkspace, 9

# Task manager
bind = CTRL SHIFT, escape, exec, missioncenter

# Screen annotation
bind = SUPER_SHIFT, F, exec, wayscriber --daemon-toggle

# Screenshots — all save to $screenshotDir and copy to clipboard
bind = SUPER_SHIFT, S, exec, hyprshot -m region -o $screenshotDir -f "$(date +'%Y-%m-%d-%H%M%S').png" --raw | tee >(wl-copy) | swappy -f -
bind = SUPER_SHIFT, D, exec, hyprshot -m region -o $screenshotDir -f "$(date +'%Y-%m-%d-%H%M%S').png"
bind = SUPER_SHIFT, W, exec, hyprshot -m window -o $screenshotDir -f "$(date +'%Y-%m-%d-%H%M%S').png"
bind = SUPER_SHIFT, M, exec, hyprshot -m output -o $screenshotDir -f "$(date +'%Y-%m-%d-%H%M%S').png"
bind = , Print, exec, hyprshot -m output -o $screenshotDir -f "$(date +'%Y-%m-%d-%H%M%S').png"

# Screen recording — toggle start/stop
bind = SUPER_SHIFT, R, exec, ~/.config/hypr/scripts/screen-record.sh mp4
bind = SUPER_SHIFT, G, exec, ~/.config/hypr/scripts/screen-record.sh gif

# Volume
bind = , XF86AudioRaiseVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%+
bind = , XF86AudioLowerVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-
bind = , XF86AudioMute, exec, wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle

# Brightness
bind = , XF86MonBrightnessUp, exec, brightnessctl set 5%+
bind = , XF86MonBrightnessDown, exec, brightnessctl set 5%-

# Window rules
windowrule {
    name = jetbrains-toolbox
    match:class = ^(jetbrains-toolbox)$
    monitor = $external
    float = on
    center = on
}

windowrule {
    name = satty
    match:class = ^(com\.gabm\.satty)$
    float = on
    center = on
}

windowrule {
    name = jetbrains
    match:class = ^(jetbrains-.*)$
    workspace = name:IDE
}

windowrule {
    name = steam
    match:class = ^(steam)$
    workspace = name:Steam
}
