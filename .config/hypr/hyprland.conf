env = LIBVA_DRIVER_NAME,nvidia
env = GBM_BACKEND,nvidia-drm
env = __GLX_VENDOR_LIBRARY_NAME,nvidia
env = NVD_BACKEND,direct
env = QT_QPA_PLATFORMTHEME,qt6ct
env = XDG_CURRENT_DESKTOP,Hyprland
env = TERMINAL, kitty

monitor = eDP-1, 1920x1080@144, 0x0, 1
monitor = HDMI-A-1, 1920x1080@120, 1920x0, 1

# Auto-disable internal monitor when external is connected
# Uses a lid switch handler to persist across DPMS/suspend/hotplug
bindl = , switch:on:Lid Switch, exec, hyprctl monitors | grep -q "HDMI-A-1" && hyprctl keyword monitor "eDP-1, disable"
bindl = , switch:off:Lid Switch, exec, hyprctl monitors | grep -q "HDMI-A-1" && hyprctl keyword monitor "eDP-1, disable" || hyprctl keyword monitor "eDP-1, 1920x1080@144, 0x0, 1"

input {
    kb_layout = us,ru
    kb_options = grp:alt_shift_toggle
    follow_mouse = 2
}

cursor {
    no_hardware_cursors = true
    default_monitor = HDMI-A-1
}

decoration {
    rounding = 10
    active_opacity = 0.9
    inactive_opacity = 0.8
}

general {
    layout = dwindle
    resize_on_border = true
    extend_border_grab_area = 14
    hover_icon_on_border = true
    col.active_border = rgba(64727dcc)
    col.inactive_border = rgba(2b303b88)
}

dwindle {
    pseudotile = true
    preserve_split = true
}

master {
    new_status = master
}

workspace = 1, monitor:HDMI-A-1, default:true
workspace = 2, monitor:HDMI-A-1
workspace = 3, monitor:HDMI-A-1 #, layout:master
workspace = 4, monitor:HDMI-A-1 #, layout:master
workspace = 5, monitor:HDMI-A-1
workspace = 6, monitor:HDMI-A-1
workspace = 7, monitor:HDMI-A-1
workspace = 8, monitor:HDMI-A-1
workspace = 9, monitor:eDP-1, default:true

# Autostart
exec-once = dbus-update-activation-environment --systemd WAYLAND_DISPLAY XDG_CURRENT_DESKTOP
exec-once = gsettings set org.gnome.desktop.interface color-scheme prefer-dark
exec-once = waybar
exec-once = nm-applet --indicator
exec-once = blueman-applet
exec-once = gnome-keyring-daemon --start --components=secrets --control-directory=/run/user/1000/keyring
exec-once = [workspace 2] telegram-desktop
exec-once = [workspace 3] pycharm
exec-once = wl-paste --watch cliphist store
exec-once = wayscriber --daemon
exec-once = ~/.config/hypr/scripts/notification-sound.sh
exec-once = hyprctl monitors | grep -q "HDMI-A-1" && hyprctl keyword monitor "eDP-1, disable"
exec-once = ~/.config/hypr/scripts/monitor-watcher.sh


# Keybinds
$mod = SUPER

bind = $mod, P, exec, ~/.config/hypr/scripts/toggle-internal-monitor.sh

bind = $mod, C, exec, cliphist list | wofi --dmenu | cliphist decode | wl-copy

bind = $mod, Return, exec, kitty
bind = $mod, D, exec, wofi --show drun
bind = $mod, Q, killactive
bind = $mod, M, exit
bind = $mod SHIFT, W, exec, pkill waybar && waybar &

# Focus
bind = $mod, left, movefocus, l
bind = $mod, right, movefocus, r
bind = $mod, up, movefocus, u
bind = $mod, down, movefocus, d
bind = $mod, H, movefocus, l
bind = $mod, L, movefocus, r
bind = $mod, K, movefocus, u
bind = $mod, J, movefocus, d

# Move windows
bind = $mod SHIFT, left, movewindow, l
bind = $mod SHIFT, right, movewindow, r
bind = $mod SHIFT, up, movewindow, u
bind = $mod SHIFT, down, movewindow, d

# Floating & layout
# bind = $mod, V, togglefloating
bind = $mod, F, fullscreen
# bind = $mod, S, togglesplit
bind = $mod, T, exec, ~/.config/waybar/scripts/hypr-split-toggle.sh
# bind = $mod, T, togglespecialworkspace, messenger

# Mouse
bindm = $mod, mouse:272, movewindow
bindm = $mod, mouse:273, resizewindow

# Workspace scroll
bind = $mod, mouse_up, workspace, e+1
bind = $mod, mouse_down, workspace, e-1

# Switch workspace
bind = CTRL, F1, workspace, 1
bind = CTRL, F2, workspace, 2
bind = CTRL, F3, workspace, 3
bind = CTRL, F4, workspace, 4
bind = CTRL, F5, workspace, 5
bind = CTRL, F6, workspace, 6
bind = CTRL, F7, workspace, 7
bind = CTRL, F8, workspace, 8
bind = CTRL, F9, workspace, 9

# Move window to workspace
bind = CTRL SHIFT, F1, movetoworkspace, 1
bind = CTRL SHIFT, F2, movetoworkspace, 2
bind = CTRL SHIFT, F3, movetoworkspace, 3
bind = CTRL SHIFT, F4, movetoworkspace, 4
bind = CTRL SHIFT, F5, movetoworkspace, 5
bind = CTRL SHIFT, F6, movetoworkspace, 6
bind = CTRL SHIFT, F7, movetoworkspace, 7
bind = CTRL SHIFT, F8, movetoworkspace, 8
bind = CTRL SHIFT, F9, movetoworkspace, 9

# Task manager
bind = CTRL SHIFT, escape, exec, missioncenter

# Screen annotation
bind = SUPER_SHIFT, D, exec, wayscriber --daemon-toggle

# Screenshots
bind = SUPER_SHIFT, S, exec, hyprshot -m region --raw | swappy -f -
# bind = SUPER_SHIFT, S, exec, hyprshot -m region --raw | satty -f -
bind = SUPER_SHIFT, W, exec, hyprshot -m window
bind = SUPER_SHIFT, M, exec, hyprshot -m output
bind = , Print, exec, hyprshot -m output

# Volume
bind = , XF86AudioRaiseVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%+
bind = , XF86AudioLowerVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-
bind = , XF86AudioMute, exec, wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle

# Brightness
bind = , XF86MonBrightnessUp, exec, brightnessctl set 5%+
bind = , XF86MonBrightnessDown, exec, brightnessctl set 5%-

# Window rules
windowrule {
    name = jetbrains-toolbox
    match:class = ^(jetbrains-toolbox)$
    monitor = HDMI-A-1
    float = on
    center = on
}

windowrule {
    name = satty
    match:class = ^(com\.gabm\.satty)$
    float = on
    center = on
}
